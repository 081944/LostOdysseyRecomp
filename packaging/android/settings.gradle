pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application' && providers.gradleProperty('loAgpVersion').isPresent()) {
                useVersion(providers.gradleProperty('loAgpVersion').get())
            }
        }
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'LostOdysseyAndroidProbe'
include ':app'
include ':runtime'
